name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Explicitly grant write access to push to the gh-pages branch
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Build Web
        run: flutter build web --release --base-href /editnova-ai-pro/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
